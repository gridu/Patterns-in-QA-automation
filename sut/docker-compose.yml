services:
  db:
    image: postgres:16-alpine
    container_name: shop_db
    restart: always
    environment:
      POSTGRES_DB: shop_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shop_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: shop_app
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgres_password@db:5432/shop_db
    ports:
      - "8000:8000"
    volumes:
      - ./static:/app/static
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
